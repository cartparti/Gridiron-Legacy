    <script type="importmap">
      { "imports": { "three": "./vendor/three.module.min.js" } }
    </script>
  </head>
  <body>
    <div id="stage" aria-hidden="true"></div>
    <div id="app"></div>
    <div id="overlay"></div>
    <div id="toasts" aria-live="polite"></div>
    <noscript>Gridiron Legacy needs JavaScript to run.</noscript>
    <script type="module" src="src/main.js"></script>
    <script>
      // Installed-app support: offline cache + ask the browser to keep saves around. Harmless where unsupported.
      try {
        if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost') && window.top === window) {
          window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
        }
        navigator.storage?.persist?.().catch(() => {});
      } catch (e) { /* ignore */ }
    </script>
  </body>
